<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e5e7eb">
    <title>Hope Village — Offline</title>
    <style>
        :root {
            --bg: #e5e7eb;
            --text: #1f2937;
            --accent: #ca8a04;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            text-align: center;
        }
        img {
            width: 96px;
            height: 96px;
            object-fit: contain;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0 0 0.5rem;
        }
        p {
            margin: 0;
            max-width: 22rem;
            line-height: 1.5;
            font-size: 0.95rem;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <img src="/hv-logo.png" alt="Hope Village">
    <h1>You’re offline</h1>
    <p>Check your internet connection, then try again. Hope Village needs a connection for most features.</p>
</body>
</html>
